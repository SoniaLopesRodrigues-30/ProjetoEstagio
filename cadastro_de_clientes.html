<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- // css // -->
    <link rel="stylesheet" href="./css/formulario.css">
    <link rel="stylesheet" href="./css/modal_Clientes.css">
</head>

<body>

    <!-- Estrutura do Modal -->
<div id="modalConsulta" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
        <h3>Consulta de Clientes</h3>        
    </div>    
    <input type="text" id="filtroTabela" placeholder="Digite o nome do cliente aqui..." class="modal-input">
    <button type="button" onclick="fecharModal()" class="btn-fechar">&times;</button>
    <div class="tabela-container">
        <table id="tabelaConsulta" class="modal-table">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nome/Razão Social</th>
                    <th>Cidade/UF</th>
                    <th>CPF/CNPJ</th>
                    <th>Aniversário</th>
                    <th>X</th>
                </tr>
            </thead>
            <tbody>
                <!-- Preenchido via JS -->
            </tbody>
        </table>
    </div>
    
    <div class="modal-footer">
        <button type="button" id="btnImprimir" class="btn-imprimir">🖨️ Imprimir</button>
    </div>
  </div>
</div>


    <!--fim do modal-->

   
    <!-- //// cabeça //// -->
    <header class="header">
        <a href="./pgPrincipal.html">
            <img src="./img/logo.png" alt="Logo da Empresa" class="logo">
        </a>
        <!-- // troca de paginas // -->
        <nav class="nav" id="nav">
            <a href="./cadastro_de_clientes.html">Clientes</a>
            <span class="texto-span">Notificação</span>
            <a href="./cadastro_de_serviço.html">Serviço</a>
            <span class="texto-span">Notiuyfyigig</span>
        </nav>
        <!-- // notificaçao // -->
        <div class="acoes">
            <!-- // btn navegaçao // -->
            <div class="nav-setas">
                <!-- btn aterior -->
                <div class="seta-box">
                    <button type="button" id ='btnAnterior' class="seta esquerda">&#171;</button>
                    <span class="texto-span">anterior</span>
                </div>
                <!-- btn proximo -->
                <div class="seta-box">
                    <button type="button" id ='btnProximo' class="seta direita">&#187;</button>
                    <span class="texto-span">proximo</span>
                </div>
            </div> 
            
        <!-- / sino / -->
        <div class="notificacao" id="btnSino" style="position: relative; cursor: pointer;">
            🔔 
            <span class="texto-span">Notificação</span>
            
            <!-- Contador de notificações (Aparece apenas se houver aniversariantes) -->
            <span id="contadorNiver" style="position: absolute; top: -5px; right: 5px; background: #ff4d4d; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: bold; display: none;">0</span>

            <!-- Menu Dropdown dos aniversariantes -->
            <div id="listaNiverDropdown" style="display: none; position: absolute; top: 100%; right: 0; background: white; border: 1px solid #ddd; width: 260px; box-shadow: 0px 4px 12px rgba(0,0,0,0.15); border-radius: 4px; z-index: 9999; max-height: 250px; overflow-y: auto; color: #333;">
                <div style="padding: 10px; border-bottom: 1px solid #eee; font-weight: bold; background: #f8f9fa; font-size: 13px;">🎂 Aniversários Próximos</div>
                <ul id="itensNotificacao" style="list-style: none; padding: 0; margin: 0;">
                    <!-- Injetado via JavaScript -->
                </ul>
            </div>
        </div>

        <!-- / btn mobile / -->
        <div class="btn-menu" id="id-btn-menu">
            ☰                  
        </div>
    </header> <!-- //// fim cabeça //// -->

    <form id="formCliente" >
        <div  class="container"> <!-- //// inicio do container //// -->
        
            <h1>Cadastro de Terceiros</h1>

            <!-- // primeiro card (1*) // -->
            <div class="card">               

            <!-- // botoes //  -->
            <div class="botoes">
                <!--botão de pesquisa Cliente-->
                
                <div class="botoes_esquerda"></div>
                    <button type="button" id="btnNovo" class="novo">Novo</button>
                <div class="botoes_direita">
                    <button id="btnSalvar" type="button" class="salvar">Salvar</button>
                    <button id="btnCancelar"  type="button" class="cancelar">Excluir</button>
                     <button type="button" id="btnConsultar">🔍 Consultar (F2)</button>
                </div> 

            </div>            
            </br>
            </br>    
                <div class="linha">
                    <div class="campo">
                        
                    <div class="campo">
                        <label>Codigo</label>
                        <input type='number' id='codigo' readonly>
                    </div>
                    
                    <div class="campo">
                        <label>Nome / Razão Social</label>                       
                        <input type="text" id="nomeCliente">
                    </div>
                    <div class="campo">
                        <label>Classificação</label>
                        <select id="tpTerceiro">
                            <option id="optCliente">Cliente</option>
                            <option id="optFornecedor">Fornecedor</option>
                            <option id="optOutros">Outro</option>
                        </select>
                    </div>
                </div>
            </div> <!--fim card 1-->

            <!-- // segundo card (2*) // -->
            <div class="card">
                <h2>Endereço</h2>
                <!--/linha/-->
                <div class="linha">
                    <!--rua-->
                    <div class="campo">
                        <label>Rua</label>
                        <input id="rua" type="text">
                    </div>
                    <!--numero-->
                    <div class="campo">
                        <label>Numero</label>
                        <input id="numero" type="text">
                    </div>
                    <!--CEP-->
                    <div class="campo">
                        <label>CEP</label>
                        <input id="cep" type="text">
                    </div>
                </div>
                <!--/linha/-->
                <div class="linha">
                    <!--cidade-->
                    <div class="campo">
                        <label>Cidade</label>
                        <input id="cidade" type="text">
                    </div>
                    <!--estado-->
                    <div class="campo">
                        <label>UF</label>
                        <select id="uf">
                            <option>RS</option>
                            <option>SC</option>
                            <option>PR</option>
                            <option>SP</option>
                            <option>RJ</option>
                            <option>PB</option>
                        </select>
                    </div>
                </div>
                <!--/linha/-->
                <div class="linha">
                    <!--bairro-->
                    <div class="campo">
                        <label>Bairro</label>
                        <input id="bairro" type="text">
                    </div>
                </div>
            </div>  <!--fim card 2-->

            <!-- // terceiro card (3*) // -->
             <div class="card">
                <h2>Documentos</h2>
                <!--/linha/-->
                <div class="linha">
                    <!--cpf-->
                    <div class="campo">
                        <label>CPF</label>
                        <input id="cpf" type="text">
                    </div>
                    <!--cnpj-->
                    <div class="campo">
                        <label>CNPJ</label>
                        <input id="cnpj" type="text">
                    </div>
                </div>
                 <!--/linha/-->
                <div class="linha">
                    <!--inscricao-->
                    <div class="campo">
                        <label>Inscriçao Estadual</label>
                        <input id="inscEstadual" type="text">
                    </div>
                </div>
            </div> <!-- // fim card 3 // -->

            <!-- // quarto card (4*) // -->
            <div class="card">
                <h2>Contato</h2>
                <!--/linha/-->
                <div class="linha">
                    <!--telefone-->
                    <div class="campo">
                        <label>Telefone</label>
                        <input id="fone" type="text">
                    </div>
                    <!--celular-->
                    <div class="campo">
                        <label>Celular</label>
                        <input id="celular" type="text">
                    </div>
                </div>
                <!--/linha/-->
                <div class="linha">
                    <!--email-->
                    <div class="campo">
                        <label>Email</label>
                        <input id="email" type="email">
                    </div>
                    <!--responsavel-->
                    <div class="campo">
                        <label>Responsavel</label>
                        <input id="resp" type="text">
                    </div>
                </div>
            </div> <!-- // fim card 4 // -->

            <!-- // quinto card (5*) // -->
            <div class="card">
                <h2>Informaçoes Extras</h2>
                <!--/linha/-->
                <div class="linha">
                    <!--aniversario-->
                    <div class="campo">
                        <label>Aniversario</label>
                        <input id="aniver" type="date">
                    </div>
                    <!--Site-->
                    <div class="campo">
                        <label>Site</label>
                        <input id="site" type="text">
                    </div>
                </div>
            </div> <!-- // fim card 5 // -->

        <!--///// pausa /////-->           

        </div> <!-- //// fim do container //// -->
    </form> 
    <!-- CHAMA O JS PARA EXECUTAR AS FUNÇÕES -->
    <script type="text/javascript" src="./js/Clientes.js"> </script>
    <!-- // js do menu mobile // -->
    <script src="./js/header.js"></script>
    <!-- // js Consulta Clientes // -->
    <script src="./js/Consulta.js"></script>
   
</body>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="container"> <!-- //// inicio do container //// -->

        <h1>Cadastro de Terceiros</h1>

        <!-- // primeiro card (1*) // -->
        <div class="card">
            <div class="linha">
                <div class="campo">
                    <label>Nome / Razão Social</label>
                    <input type="text">
                </div>
                <div class="campo">
                    <label>Classificação</label>
                    <select>
                        <option>Cliente</option>
                        <option>Fornecedor</option>
                        <option>Outro</option>
                    </select>
                </div>
            </div>
        </div> <!--fim card 1-->

        <!-- // segundo card (2*) // -->
        <div class="card">
            <h2>Endereço</h2>
            <!--linha-->
            <div class="linha">
                <!--rua-->
                <div class="campo">
                    <label>Rua</label>
                    <input type="text">
                </div>
                <!--numero-->
                <div class="campo">
                    <label>Numero</label>
                    <input type="text">
                </div>
                <!--CEP-->
                <div class="campo">
                    <label>CEP</label>
                    <input type="text">
                </div>
            </div>
            <!--linha-->
            <div class="linha">
                <!--cidade-->
                <div class="campo">
                    <label>Cidade</label>
                    <input type="text">
                </div>
                <!--estado-->
                <div class="campo">
                    <label>UF</label>
                    <section>
                        <option>RS</option>
                        <option>SC</option>
                        <option>PR</option>
                    </section>
                </div>
            </div>
            <!--linha-->
            <div class="linha">
                <!--bairro-->
                <div class="campo">
                    <label>Bairro</label>
                    <input type="text">
                </div>
            </div>
        </div>  <!--fim card 2-->

        <!-- // terceiro card (3*) // -->
         <div class="card">
            <h2>Documentos</h2>
            <!--linha-->
            <div class="linha">
                <!--cpf-->
                <div class="campo">
                    <label>CPF</label>
                    <input type="text">
                </div>
                <!--cnpj-->
                <div class="campo">
                    <label>CNPJ</label>
                    <input type="text">
                </div>
            </div>
             <!--linha-->
            <div class="linha">
                <!--inscricao-->
                <div class="campo">
                    <label>Inscriçao Estadual</label>
                    <input type="text">
                </div>
            </div>
         </div> <!-- // fim card 3 // -->





    </div> <!-- //// fim do container //// -->



</body>


<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link rel="stylesheet" type="text/css" href="./css/login.css" />

</head>

<body>
    
<div class="container">
<!-- // Div esquerdo // -->
<!-- // login // -->
    <div class="login-area">
        <h1>Conecte-se</h1>
        <p class="sub">Insira seu endereço de e-mail e senha.</p>
        <!-- usuario-->
        <div class="campo">
            <span class="icon">&#128100;</span>
            <input type="text" id="usuario" placeholder="Digite seu usuário aqui...">
        </div>
        <!-- senha -->
        <div class="campo">
            <span class="icon">&#128274;</span>
            <input type="password" id="senha" placeholder="Digite sua senha aqui...">
        </div>
        <button class="btn-entrar" onclick="login()" >ENTRAR</button>
    </br>
    </br>
        <button class="btn-entrar" id="btnUsuario" onclick="login()" >CADASTRAR USUÁRIO</button>
<!-- // msg de erro // -->
        <div id="erro" class="erro">Usuário ou senha inválidos</div>
    </div>
<!-- // Div direito //-->
    <div class="info-area">       
 
        <img src="./img/logo_login.png" alt="Logo da Empresa" class="logo">
        
    </div>
</div>
<!-- CHAMA O ARQUIVO JS DE FUNÇÕES-->
<script type="text/javascript" src="./js/script.js"> </script> 
</body>
</html>
